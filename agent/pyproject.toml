[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "deskpanel-agent"
version = "0.1.0"
description = "Laptop companion service for the DeskPanel phone dashboard"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.115",
  "uvicorn[standard]>=0.30",
  "pydantic>=2.7",
  "psutil>=6.0",
  "zeroconf>=0.132",
  "qrcode>=7.4",
  "pillow>=10.0",
  "cryptography>=42",
  "httpx>=0.27",
  "icalendar>=6",
  "recurring-ical-events>=3",
  "paho-mqtt>=2.0",
  "pystray>=0.19; sys_platform == 'darwin'",
  "pyobjc-framework-Quartz>=10; sys_platform == 'darwin'",  # event tap for sharing the mouse
]

[project.optional-dependencies]
dev = ["pytest>=8", "pytest-asyncio>=0.23", "httpx>=0.27"]

[project.scripts]
deskpanel-agent = "deskpanel_agent.cli:main"

[tool.setuptools.packages.find]
include = ["deskpanel_agent*"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
